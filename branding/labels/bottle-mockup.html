<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body{
    background:
      radial-gradient(120% 90% at 50% 15%, #ffffff 0%, #f3f1ea 55%, #e7e3d8 100%);
    font-family:system-ui,sans-serif;
  }
  .stage{display:flex;align-items:flex-end;justify-content:center;gap:70px;padding:90px 70px 70px;min-height:900px;}
  .unit{display:flex;flex-direction:column;align-items:center;}
  .cap{margin-top:30px;text-align:center;}
  .cap .n{font-family:"Roboto Slab",Georgia,serif;font-weight:600;font-size:17px;color:#14331F;}
  .cap .s{font-family:"JetBrains Mono",monospace;font-size:11px;color:#6B7064;letter-spacing:.06em;margin-top:4px;}

  /* shared jar pieces */
  .jar{position:relative;filter:drop-shadow(0 28px 26px rgba(20,51,31,.28));}
  .floor{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);width:115%;height:40px;border-radius:50%;
    background:radial-gradient(closest-side, rgba(20,51,31,.28), transparent 72%);z-index:0;}

  .lid{position:relative;margin:0 auto;border-radius:11px 11px 7px 7px;z-index:3;
    background:linear-gradient(180deg,#3a3a3a 0%,#101010 38%,#000 70%,#222 100%);
    box-shadow:inset 0 3px 6px rgba(255,255,255,.18), inset 0 -6px 10px rgba(0,0,0,.6);}
  .lid::after{content:"";position:absolute;inset:0 0 auto 0;height:100%;border-radius:11px 11px 7px 7px;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 2px, transparent 2px 6px);opacity:.5;}
  .neck{position:relative;margin:-4px auto 0;background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.12));z-index:1;}

  .body{position:relative;margin:0 auto;overflow:hidden;z-index:2;}
  /* glass gloss shared */
  .body .gloss{position:absolute;inset:0;z-index:4;pointer-events:none;
    background:
      linear-gradient(90deg, rgba(255,255,255,.32) 0%, rgba(255,255,255,.04) 12%, transparent 26%, transparent 64%, rgba(255,255,255,.10) 84%, rgba(255,255,255,.32) 100%);}
  .body .gloss2{position:absolute;top:6%;left:14%;width:10%;height:70%;border-radius:50%;z-index:5;
    background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0));filter:blur(2px);pointer-events:none;}

  /* label wrap on cylinder */
  .label-on{position:absolute;left:50%;transform:translateX(-50%);z-index:6;border-radius:9px;overflow:hidden;
    box-shadow:0 2px 5px rgba(0,0,0,.25);}
  .label-on img{display:block;width:100%;height:100%;object-fit:cover;}
  .label-on .curve{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg, rgba(30,20,8,.30) 0%, rgba(30,20,8,.06) 11%, transparent 28%, transparent 72%, rgba(30,20,8,.06) 89%, rgba(30,20,8,.30) 100%);}

  /* ---- HONEY / GHEE amber jars ---- */
  .amber .body{background:
      linear-gradient(180deg, #6b3d12 0%, #57300c 22%, #3c200a 55%, #2c1606 80%, #4a2a0e 100%);}
  .ghee .body{background:
      linear-gradient(180deg, #efd587 0%, #e7c45f 30%, #d9ad44 70%, #c99a36 100%);}
</style>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;600&family=JetBrains+Mono&display=swap" rel="stylesheet" />
</head>
<body>
<div class="stage">

  <!-- OIL — tall 1L bottle, clear/green glass -->
  <div class="unit">
    <div class="jar">
      <div class="floor"></div>
      <div class="lid" style="width:78px;height:42px;"></div>
      <div class="neck" style="width:60px;height:46px;border-radius:4px;background:linear-gradient(180deg,#dfe7d8,#b9c7ab 40%,#aebfa0);"></div>
      <div class="body" style="width:208px;height:430px;border-radius:20px 20px 16px 16px;
           background:linear-gradient(180deg,#e9c98e 0%,#dDB76a 18%,#cf9f49 52%,#c4923c 82%,#d2a64f 100%);">
        <div class="gloss"></div><div class="gloss2"></div>
        <div class="label-on" style="top:96px;width:170px;height:248px;">
          <img src="../previews/front-oil.png" alt="" /><div class="curve"></div>
        </div>
      </div>
    </div>
    <div class="cap"><div class="n">Cold-Pressed Groundnut Oil</div><div class="s">1 L · flint-glass bottle</div></div>
  </div>

  <!-- GHEE — 500ml amber jar -->
  <div class="unit">
    <div class="jar ghee">
      <div class="floor"></div>
      <div class="lid" style="width:150px;height:64px;"></div>
      <div class="neck" style="width:130px;height:14px;border-radius:4px;"></div>
      <div class="body" style="width:230px;height:300px;border-radius:18px 18px 22px 22px;">
        <div class="gloss"></div><div class="gloss2"></div>
        <div class="label-on" style="top:30px;width:188px;height:240px;">
          <img src="../previews/front-ghee.png" alt="" /><div class="curve" style="background:linear-gradient(90deg, rgba(60,40,10,.28) 0%, rgba(60,40,10,.05) 12%, transparent 30%, transparent 70%, rgba(60,40,10,.05) 88%, rgba(60,40,10,.28) 100%)"></div>
        </div>
      </div>
    </div>
    <div class="cap"><div class="n">A2 Gir Cow Bilona Ghee</div><div class="s">500 ml · amber-glass jar</div></div>
  </div>

  <!-- HONEY — 500g amber jar -->
  <div class="unit">
    <div class="jar amber">
      <div class="floor"></div>
      <div class="lid" style="width:150px;height:66px;"></div>
      <div class="neck" style="width:132px;height:14px;border-radius:4px;"></div>
      <div class="body" style="width:232px;height:316px;border-radius:18px 18px 24px 24px;">
        <div class="gloss"></div><div class="gloss2"></div>
        <div class="label-on" style="top:36px;width:190px;height:246px;">
          <img src="../previews/front-honey.png" alt="" /><div class="curve"></div>
        </div>
      </div>
    </div>
    <div class="cap"><div class="n">Wild Forest Honey</div><div class="s">500 g · amber-glass jar</div></div>
  </div>

</div>
</body>
</html>
