<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;600;700&family=Lora:ital,wght@1,500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .post{position:relative;width:768px;height:1365px;overflow:hidden;}
  .post>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .brandblock{position:absolute;left:50%;top:53.5%;transform:translate(-50%,-50%);
    width:300px;text-align:center;color:#14331F;}
  .wordmark{font-family:"Roboto Slab",serif;font-weight:600;font-size:17px;letter-spacing:.34em;
    text-transform:uppercase;color:#1F4D2E;}
  .wordmark .leaf{color:#66BF73;}
  .rule{display:flex;align-items:center;justify-content:center;gap:8px;margin:9px 0 11px;color:#B5862F;}
  .rule::before,.rule::after{content:"";height:1px;width:40px;background:linear-gradient(90deg,transparent,#B5862F);}
  .rule::after{background:linear-gradient(90deg,#B5862F,transparent);}
  .rule span{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;}
  .pname{font-family:"Roboto Slab",serif;font-weight:600;font-size:46px;line-height:.98;color:#14331F;letter-spacing:-.015em;}
  .desc{font-family:"Lora",serif;font-style:italic;font-size:17px;color:#8A6420;margin-top:8px;}
  .meta{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#3C2F1F;margin-top:12px;}
</style>
</head>
<body>
<div class="post">
  <img class="bg" src="../previews/anveshan-honey-blank.png" alt="" />
  <div class="brandblock">
    <div class="wordmark">Nutri Greenz</div>
    <div class="rule"><span>Raw · Single-Forest</span></div>
    <div class="pname">Wild Forest</div>
    <div class="desc">Honey, exactly as the bees made it</div>
    <div class="meta">Sundarbans · Net 500 g</div>
  </div>
</div>
</body>
</html>
